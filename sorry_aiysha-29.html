<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry, Aiysha ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,sans-serif; background:linear-gradient(135deg,#ffd6e7,#fff1f6);
  overflow:hidden; color:#4a2635;
}
.card{
  width:min(90%,430px); padding:38px 28px; text-align:center; background:#ffffffdd;
  backdrop-filter:blur(8px); border-radius:28px; box-shadow:0 15px 45px #b85b7a33;
}
.heart{font-size:62px; animation:beat 1.2s infinite}
h1{font-size:38px;margin:8px 0 14px}
p{font-size:18px;line-height:1.6;margin:10px 0 24px}
button{
  border:0; padding:14px 25px; border-radius:999px; font-size:17px;
  background:#e85d8a;color:white;cursor:pointer;box-shadow:0 7px 18px #e85d8a55;
}
#reply{display:none;margin-top:20px;font-weight:bold;font-size:18px}
.float{position:absolute;bottom:-30px;font-size:22px;animation:up 7s linear infinite;opacity:.65}
@keyframes beat{50%{transform:scale(1.12)}}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <h1>I'm Sorry, Aiysha</h1>
  <p>
    I know I messed up, and I'm genuinely sorry.<br>
    I never meant to hurt or upset you.<br>
    You matter to me, and I hope you can forgive me.
  </p>
  <button onclick="document.getElementById('reply').style.display='block'">Forgive me? 🥺</button>
  <div id="reply">Thank you, Aiysha ❤️</div>
</div>
<script>
for(let i=0;i<14;i++){
  const x=document.createElement('div'); x.className='float';
  x.textContent=['❤️','💗','💕','✨'][i%4];
  x.style.left=Math.random()*100+'%';
  x.style.animationDelay=Math.random()*6+'s';
  document.body.appendChild(x);
}
</script>
</body>
</html>
